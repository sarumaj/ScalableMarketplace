# Converted from .github/workflows/test.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: Test
'on':
  push:
    branches:
    - main
    - renovate/all-patch
  pull_request: null
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
        - 20.x
        - 22.x
    steps:
    - uses: https://github.com/actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: https://github.com/actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Root - install
      run: npm ci
    - name: Root - compile
      run: npm run compile
    # As JUnit-style XML (MOCHA_JUNIT, hardhat.config.cjs) for the report below, which
    # also prints the failed tests' messages.
    - name: Root - test
      id: tests
      run: npm test
      env:
        MOCHA_JUNIT: /tmp/mocha.xml
    # The results as one comment per Node version on the pull request
    # (dawid/ci-actions), also when tests failed.
    - name: Test report
      if: always() && steps.tests.outcome != 'skipped'
      uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
      with:
        junit: /tmp/mocha.xml
        name: Test / build (Node ${{ matrix.node-version }})
    - name: Frontend - install
      run: npm ci
      working-directory: frontend
    - name: Frontend - build
      run: npm run build
      working-directory: frontend
